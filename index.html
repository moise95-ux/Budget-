<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Budget</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button id="prevMonth" aria-label="Mois précédent">‹</button>
      <h1 id="monthTitle">Octobre 2026</h1>
      <button id="nextMonth" aria-label="Mois suivant">›</button>
    </header>

    <section class="salary-card">
      <div>
        <span class="eyebrow">Salaire du mois</span>
        <strong id="salaryDisplay">2 400 €</strong>
      </div>
      <button id="editSalary" class="icon-btn" aria-label="Modifier le salaire">✎</button>
    </section>

    <section class="summary">
      <div class="summary-card expense">
        <span>Total des charges</span>
        <strong id="chargesDisplay">1 690 €</strong>
      </div>
      <div class="summary-card saving">
        <span>Épargne</span>
        <strong id="savingDisplay">400 €</strong>
      </div>
      <div class="summary-card remaining">
        <span>Reste</span>
        <strong id="remainingDisplay">310 €</strong>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">
        <h2>Répartition du salaire</h2>
        <span id="percentLabel">100 %</span>
      </div>
      <div class="chart-wrap">
        <div id="donut" class="donut">
          <div class="donut-center">
            <strong id="donutAmount">2 400 €</strong>
            <span>Salaire</span>
          </div>
        </div>
      </div>
      <div id="legend" class="legend"></div>
    </section>

    <section class="panel">
      <div class="panel-title">
        <h2>Mes charges</h2>
        <button id="addCharge" class="primary small">+ Ajouter</button>
      </div>
      <div id="chargesList" class="charges-list"></div>
    </section>

    <section class="saving-row">
      <div>
        <span>Épargne mensuelle</span>
        <strong id="savingRowDisplay">400 €</strong>
      </div>
      <button id="editSaving" class="icon-btn" aria-label="Modifier l'épargne">✎</button>
    </section>

    <button id="saveMonth" class="primary save">Enregistrer le mois</button>

    <nav class="bottom-nav">
      <button class="active">⌂<span>Accueil</span></button>
      <button>☷<span>Charges</span></button>
      <button>⚙<span>Paramètres</span></button>
    </nav>
  </main>

  <dialog id="salaryDialog">
    <form method="dialog" class="dialog-form" id="salaryForm">
      <h2>Modifier le salaire</h2>
      <label>Montant (€)<input id="salaryInput" type="number" min="0" step="0.01" required></label>
      <div class="dialog-actions"><button value="cancel">Annuler</button><button class="primary" value="ok">Valider</button></div>
    </form>
  </dialog>

  <dialog id="savingDialog">
    <form method="dialog" class="dialog-form" id="savingForm">
      <h2>Modifier l'épargne</h2>
      <label>Montant (€)<input id="savingInput" type="number" min="0" step="0.01" required></label>
      <div class="dialog-actions"><button value="cancel">Annuler</button><button class="primary" value="ok">Valider</button></div>
    </form>
  </dialog>

  <dialog id="chargeDialog">
    <form method="dialog" class="dialog-form" id="chargeForm">
      <h2 id="chargeDialogTitle">Ajouter une charge</h2>
      <label>Nom<input id="chargeName" type="text" maxlength="40" required></label>
      <label>Montant (€)<input id="chargeAmount" type="number" min="0" step="0.01" required></label>
      <input id="chargeIndex" type="hidden" value="-1">
      <div class="dialog-actions"><button value="cancel">Annuler</button><button class="primary" value="ok">Enregistrer</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
